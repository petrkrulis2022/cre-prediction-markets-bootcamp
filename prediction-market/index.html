<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRE Prediction Market - MetaMask UI</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 500px;
        width: 100%;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 28px;
      }

      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .status-section {
        background: #f5f5f5;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 25px;
      }

      .status-label {
        color: #666;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 5px;
      }

      .status-value {
        color: #333;
        font-size: 14px;
        font-weight: 500;
        word-break: break-all;
      }

      .status-value.connected {
        color: #22c55e;
      }

      .status-value.disconnected {
        color: #ef4444;
      }

      .button {
        background: #667eea;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.3s ease;
        margin-right: 10px;
      }

      .button:hover {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .button:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }

      .button.secondary {
        background: #6b7280;
      }

      .button.secondary:hover {
        background: #4b5563;
      }

      .button.success {
        background: #22c55e;
      }

      .button.success:hover {
        background: #16a34a;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        color: #333;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      input[type="text"] {
        width: 100%;
        padding: 12px;
        border: 2px solid #e5e7eb;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.3s ease;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: #667eea;
      }

      .buttons-group {
        display: flex;
        gap: 10px;
        margin-top: 30px;
      }

      .result {
        background: #f0fdf4;
        border-left: 4px solid #22c55e;
        padding: 15px;
        border-radius: 6px;
        margin-top: 20px;
        display: none;
      }

      .result.error {
        background: #fef2f2;
        border-left-color: #ef4444;
      }

      .result.loading {
        background: #eff6ff;
        border-left-color: #3b82f6;
      }

      .result.show {
        display: block;
      }

      .result-label {
        color: #666;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 5px;
      }

      .result-value {
        color: #333;
        font-size: 13px;
        word-break: break-all;
        font-family: "Courier New", monospace;
      }

      .result.error .result-label {
        color: #991b1b;
      }

      .result.error .result-value {
        color: #991b1b;
      }

      .result.loading .result-label {
        color: #1e40af;
      }

      .result.loading .result-value {
        color: #1e40af;
      }

      .link {
        color: #667eea;
        text-decoration: none;
        font-weight: 500;
        margin-top: 10px;
        display: inline-block;
      }

      .link:hover {
        text-decoration: underline;
      }

      .loader {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid #f3f3f3;
        border-top: 2px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 8px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎯 Prediction Market</h1>
      <p class="subtitle">Create a new market prediction on Sepolia testnet</p>

      <!-- Connection Status -->
      <div class="status-section">
        <div class="status-label">Wallet Status</div>
        <div class="status-value disconnected" id="statusWallet">
          Not Connected
        </div>
        <div class="status-label" style="margin-top: 10px">Network</div>
        <div class="status-value" id="statusNetwork">--</div>
      </div>

      <!-- Address Display -->
      <div class="status-section" id="addressSection" style="display: none">
        <div class="status-label">Connected Address</div>
        <div class="status-value" id="connectedAddress">--</div>
      </div>

      <!-- Form -->
      <div class="form-group">
        <label for="questionInput">Market Question</label>
        <input
          type="text"
          id="questionInput"
          placeholder="e.g., Will Bitcoin reach $100k by end of 2026?"
          disabled
        />
      </div>

      <!-- Buttons -->
      <div class="buttons-group">
        <button class="button" id="connectBtn" onclick="connectMetaMask()">
          Connect MetaMask
        </button>
        <button
          class="button secondary"
          id="disconnectBtn"
          onclick="disconnectWallet()"
          style="display: none"
        >
          Disconnect
        </button>
      </div>

      <button
        class="button success"
        id="createBtn"
        onclick="createMarket()"
        style="display: none; width: 100%; margin-top: 15px"
      >
        Create Market
      </button>

      <!-- Result -->
      <div class="result" id="result">
        <div class="result-label" id="resultLabel">Transaction Hash</div>
        <div class="result-value" id="resultValue">Loading...</div>
        <div id="detailedResults" style="margin-top: 15px; display: none">
          <div
            style="
              background: #f5f5f5;
              padding: 10px;
              border-radius: 6px;
              font-size: 12px;
            "
          >
            <div style="margin-bottom: 8px">
              <strong>Gas Used:</strong> <span id="gasUsed">--</span>
            </div>
            <div style="margin-bottom: 8px">
              <strong>Market Creator:</strong>
              <span id="marketCreator" style="word-break: break-all">--</span>
            </div>
            <div style="margin-bottom: 8px">
              <strong>Market Question:</strong>
              <span id="marketQuestion">--</span>
            </div>
            <div style="margin-bottom: 8px">
              <strong>Created At:</strong> <span id="createdAt">--</span>
            </div>
            <div style="margin-bottom: 8px">
              <strong>Status:</strong> <span id="marketStatus">Active</span>
            </div>
            <div>
              <strong>Pool Info:</strong> Yes: <span id="yesPool">0</span> | No:
              <span id="noPool">0</span>
            </div>
          </div>
        </div>
        <a
          href="#"
          class="link"
          id="etherscanLink"
          target="_blank"
          style="display: none"
          >View on Etherscan →</a
        >
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script>
      // Contract details
      const CONTRACT_ADDRESS = "0x5E8Aa6C48008B787B432764A7943e07A68b3c098";
      const CONTRACT_ABI = [
        {
          inputs: [
            { internalType: "string", name: "question", type: "string" },
          ],
          name: "createMarket",
          outputs: [
            { internalType: "uint256", name: "marketId", type: "uint256" },
          ],
          stateMutability: "nonpayable",
          type: "function",
        },
      ];

      const SEPOLIA_CHAIN_ID = "0xaa36a7"; // 11155111 in hex
      let web3;
      let userAccount = null;
      let contract;

      // Initialize Web3
      async function initializeWeb3() {
        if (typeof window.ethereum !== "undefined") {
          web3 = new Web3(window.ethereum);
          contract = new web3.eth.Contract(CONTRACT_ABI, CONTRACT_ADDRESS);

          // Listen for account changes
          window.ethereum.on("accountsChanged", (accounts) => {
            userAccount = accounts[0] || null;
            updateUI();
          });

          // Listen for network changes
          window.ethereum.on("chainChanged", () => {
            checkNetwork();
          });
        } else {
          showResult("MetaMask not detected. Please install it.", true);
        }
      }

      // Connect to MetaMask
      async function connectMetaMask() {
        try {
          const accounts = await window.ethereum.request({
            method: "eth_requestAccounts",
          });
          userAccount = accounts[0];

          // Check network
          await checkNetwork();
          updateUI();
        } catch (error) {
          showResult("Failed to connect: " + error.message, true);
        }
      }

      // Check if on Sepolia network
      async function checkNetwork() {
        try {
          const chainId = await web3.eth.getChainId();
          const sepoliaChainId = 11155111;

          if (chainId === sepoliaChainId) {
            document.getElementById("statusNetwork").textContent =
              "✓ Sepolia Testnet";
            document.getElementById("statusNetwork").style.color = "#22c55e";
          } else {
            document.getElementById("statusNetwork").textContent =
              `Wrong network (Chain ID: ${chainId}). Switch to Sepolia.`;
            document.getElementById("statusNetwork").style.color = "#ef4444";
            showResult("Please switch to Sepolia testnet in MetaMask", true);
          }
        } catch (error) {
          console.error("Network check error:", error);
        }
      }

      // Disconnect wallet
      function disconnectWallet() {
        userAccount = null;
        updateUI();
        clearResult();
      }

      // Update UI based on connection state
      function updateUI() {
        if (userAccount) {
          document.getElementById("statusWallet").textContent = "✓ Connected";
          document.getElementById("statusWallet").className =
            "status-value connected";
          document.getElementById("connectedAddress").textContent = userAccount;
          document.getElementById("addressSection").style.display = "block";
          document.getElementById("questionInput").disabled = false;
          document.getElementById("createBtn").style.display = "block";
          document.getElementById("connectBtn").style.display = "none";
          document.getElementById("disconnectBtn").style.display = "block";
        } else {
          document.getElementById("statusWallet").textContent = "Not Connected";
          document.getElementById("statusWallet").className =
            "status-value disconnected";
          document.getElementById("addressSection").style.display = "none";
          document.getElementById("questionInput").disabled = true;
          document.getElementById("createBtn").style.display = "none";
          document.getElementById("connectBtn").style.display = "block";
          document.getElementById("disconnectBtn").style.display = "none";
        }
      }

      // Create market
      async function createMarket() {
        const question = document.getElementById("questionInput").value.trim();

        if (!question) {
          showResult("Please enter a market question", true);
          return;
        }

        if (!userAccount) {
          showResult("Please connect MetaMask first", true);
          return;
        }

        try {
          console.log("=== CREATE MARKET TRANSACTION ===");
          console.log("Question:", question);
          console.log("Creator Address:", userAccount);
          console.log("Timestamp:", new Date().toISOString());

          showResult(
            '<span class="loader"></span>Creating market...',
            false,
            "loading",
          );

          const result = await contract.methods.createMarket(question).send({
            from: userAccount,
            gas: 500000,
          });

          // Extract transaction details
          const txHash = result.transactionHash;
          const blockNumber = result.blockNumber;
          const gasUsed = result.gasUsed;
          const etherscanUrl = `https://sepolia.etherscan.io/tx/${txHash}`;

          // Log transaction details
          console.log("✓ Transaction Confirmed!");
          console.log("Transaction Hash:", txHash);
          console.log("Block Number:", blockNumber);
          console.log("Gas Used:", gasUsed);
          console.log("From:", result.from);
          console.log("To:", result.to);

          // Get the market ID (should be marketCount - 1)
          const marketCountBigInt = await contract.methods.marketCount().call();
          const marketId = parseInt(marketCountBigInt) - 1;
          console.log("Market ID:", marketId);

          // Fetch market data from contract
          console.log("\n=== FETCHING MARKET DATA ===");
          const marketData = await contract.methods.getMarket(marketId).call();

          console.log("Market Creator:", marketData[0]);
          console.log(
            "Created At:",
            marketData[1],
            "(" + new Date(marketData[1] * 1000).toISOString() + ")",
          );
          console.log("Settled At:", marketData[2]);
          console.log("Settled:", marketData[3]);
          console.log("Fee Percent:", marketData[4]);
          console.log("Resolution Source:", marketData[5]);
          console.log("Yes Pool:", marketData[6]);
          console.log("No Pool:", marketData[7]);
          console.log("Question:", marketData[8]);

          // Update UI with results
          document.getElementById("resultLabel").textContent =
            "✓ Market Created Successfully!";
          document.getElementById("resultValue").textContent = txHash;
          document.getElementById("gasUsed").textContent =
            gasUsed.toLocaleString() + " gas";
          document.getElementById("marketCreator").textContent = marketData[0];
          document.getElementById("marketQuestion").textContent = marketData[8];
          document.getElementById("createdAt").textContent = new Date(
            marketData[1] * 1000,
          ).toLocaleString();
          document.getElementById("marketStatus").textContent = marketData[3]
            ? "Settled"
            : "Active";
          document.getElementById("yesPool").textContent = (
            marketData[6] / 1e18
          ).toFixed(2);
          document.getElementById("noPool").textContent = (
            marketData[7] / 1e18
          ).toFixed(2);

          // Show detailed results
          document.getElementById("detailedResults").style.display = "block";

          // Setup Etherscan link
          document.getElementById("etherscanLink").href = etherscanUrl;
          document.getElementById("etherscanLink").style.display =
            "inline-block";

          console.log("\n✅ MARKET CREATION COMPLETE");
          console.log("View on Etherscan:", etherscanUrl);
          console.log("=======================\n");

          // Clear input
          document.getElementById("questionInput").value = "";
        } catch (error) {
          console.error("❌ Error creating market:", error);
          showResult("Error: " + (error.message || error), true);
          document.getElementById("etherscanLink").style.display = "none";
        }
      }

      // Show result message
      function showResult(message, isError = false, type = "normal") {
        const resultDiv = document.getElementById("result");
        const resultLabel = document.getElementById("resultLabel");
        const resultValue = document.getElementById("resultValue");

        resultLabel.textContent = isError
          ? "Error"
          : type === "loading"
            ? "Status"
            : "Success";
        resultValue.innerHTML = message;

        resultDiv.classList.remove("error", "loading", "success");
        if (isError) resultDiv.classList.add("error");
        else if (type === "loading") resultDiv.classList.add("loading");
        else if (type === "success") resultDiv.classList.add("success");

        resultDiv.classList.add("show");
      }

      // Clear result
      function clearResult() {
        document.getElementById("result").classList.remove("show");
      }

      // Initialize on load
      window.addEventListener("load", () => {
        initializeWeb3();
        updateUI();
      });
    </script>
  </body>
</html>
